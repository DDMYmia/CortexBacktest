[build-system]
# >=77 for PEP 639 license expression / license-files support.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexbacktest"
version = "0.0.1"
description = "CortexBacktest: event-driven and cross-sectional factor backtesting engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "backtesting",
  "quantitative-finance",
  "trading",
  "factor-research",
  "polars",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.1",
  # Cap below 2.0: Polars 2.0 is a breaking major, so an unpinned install must
  # not silently pull it in. The `polars-pinned` CI job (quality.yml) runs the suite
  # on the pinned stable version; bump that pin deliberately.
  "polars>=1.0,<2",
  "pyarrow>=18.0",
  "orjson>=3.10",
  "jsonschema[format]>=4.23,<5",
]

[project.scripts]
cortexbacktest = "cortexbacktest.cli:main"

[project.optional-dependencies]
# SQL over the Parquet research layer. Optional because the engine itself reads
# bars through its own feeds; DuckDB is for asking questions of the layer.
duck = [
  "duckdb>=1.1,<2",
]
dev = [
  "pytest>=8.0",
  # The DuckDB query layer is tested against real Parquet, not mocked.
  "duckdb>=1.1,<2",
  "ruff>=0.6,<0.16",
  "basedpyright>=1.20",
  # pandas is not a runtime dependency, but the data-boundary tests
  # (yfinance/ccxt adapters, pandas backend) exercise it.
  "pandas>=2.2",
  # Exchange schedules are the only source of early closes, so the calendar
  # extra has to be exercised rather than skipped.
  "pandas_market_calendars>=4.4",
  # Callers pass pytz-localized timestamps; the DST regression test uses them.
  "pytz>=2024.1",
]
calendar = [
  "pandas_market_calendars>=4.4",
]
analytics = [
  "scipy>=1.12",
]
optimizer = [
  "cvxpy>=1.5",
]
data = [
  # yfinance and ccxt return pandas, so the adapters that consume them need it.
  "pandas>=2.2",
  "ccxt>=4.3",
  "yfinance>=0.2.40",
]
ml = [
  "scikit-learn>=1.4",
]
indicators = [
  "pandas-ta-classic==0.8.32",
]
tulip = [
  "tulipy==0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

# Ship the inline type hints so consumers' type checkers use them (PEP 561).
[tool.setuptools.package-data]
cortexbacktest = ["py.typed", "adapters/*.schema.json", "reporting/*.schema.json", "pipelines/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["references", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
# Standard mode catches real type bugs without the "everything is Unknown"
# firehose that strict mode produces on a Polars codebase (Polars ships
# incomplete stubs, so most Unknown* reports are noise, not defects).
typeCheckingMode = "standard"
# Optional third-party integrations are imported lazily inside functions.
reportMissingImports = false
reportMissingModuleSource = false
